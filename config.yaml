# =============================================================================
# RUNTIME CONFIGURATION
# =============================================================================
# Everything that you might reasonably want to change without editing code
# lives here. API keys do NOT go here — they go in a .env file (see .env.example)
# so that secrets never land in git.
# =============================================================================

# ---- Interview language -----------------------------------------------------
# en = English | hi = Hindi | de = German
# Drives: STT language hint, the language the interviewer speaks/writes, and
# the TTS voice language. Can be overridden live from the sidebar in the app.
language: en

interview:
  dataset_path: "data/questions.yaml"
  max_follow_ups_per_question: 2   # after this many, the agent must move on
  # Interview can be cut short for a quick demo. null = ask every question.
  max_questions: null

# ---- Speech-to-text (the "ear") ---------------------------------------------
stt:
  provider: groq
  model: "whisper-large-v3-turbo"  # multilingual, ~216x real-time on Groq
  # whisper auto-detects language, but we pass a hint for accuracy on hi/de.
  pass_language_hint: true

# ---- The interviewer brain (LLM) --------------------------------------------
llm:
  provider: groq
  # gpt-oss-120b is Groq's recommended successor after llama-3.3-70b-versatile
  # was deprecated (17 Jun 2026). Swap to "openai/gpt-oss-20b" for lower latency
  # or any other Groq chat model — nothing else needs to change.
  model: "openai/gpt-oss-120b"
  temperature: 0.4          # low-ish: consistent judgement, still natural
  max_tokens: 700
  reasoning_effort: low     # keep latency down on reasoning-capable models

# ---- Text-to-speech (the "mouth") -------------------------------------------
tts:
  # "edge" = free, no API key (Microsoft Edge neural voices via edge-tts).
  #          Native voices for en/hi/de. This is the default so the whole app
  #          runs on just a free Groq key — nothing paid.
  # "elevenlabs" = higher quality, needs ELEVENLABS_API_KEY. See block below.
  provider: edge
  model: "edge"                     # unused for edge; set for elevenlabs (e.g. eleven_flash_v2_5)
  output_format: "mp3_44100_128"    # used by elevenlabs; edge always returns mp3
  # For edge, these are Edge voice NAMES; for elevenlabs they are voice IDs.
  default_voice_id: "en-US-AriaNeural"
  voice_by_language:
    en: "en-US-AriaNeural"
    hi: "hi-IN-SwaraNeural"
    de: "de-DE-KatjaNeural"
  voice_settings:                   # used by elevenlabs only
    stability: 0.5
    similarity_boost: 0.75
    style: 0.0
    use_speaker_boost: true

# ---- (Swap) Higher-quality TTS with ElevenLabs ------------------------------
# To use ElevenLabs instead of free Edge voices:
#   1. put ELEVENLABS_API_KEY in your .env
#   2. set tts.provider: elevenlabs  (above)
#   3. set tts.model: "eleven_flash_v2_5"  (or "eleven_multilingual_v2")
#   4. replace the voice_by_language values with ElevenLabs voice IDs, e.g.
#      en/hi/de: "JBFqnCBsd6RMkjVDRZzb"  ("George" — works across languages)

# ---- Retrieval / grounding --------------------------------------------------
retrieval:
  # "id"       -> exact lookup by question id (primary path; the interview is
  #               agent-driven so this is what actually runs each turn).
  # "semantic" -> ALSO build embeddings so free-form text can be matched to the
  #               nearest canonical question (used for scale / flexible nav).
  mode: semantic
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"  # tiny, multilingual
  top_k: 1
